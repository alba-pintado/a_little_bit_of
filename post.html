<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Alba Pintado Rodrigo">
  <title>A Little Bit Of…</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Outfit:wght@400;500;600;700&family=Homemade+Apple&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main id="main" class="wrap"></main>

  <!-- Markdown and code highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="assets/js/site.js"></script>
  <script>
    /* One page shows any entry: post.html?c=<collection>&id=<id> */
    Site.ready().then(function (S) {
      var esc = Site.esc, main = document.getElementById("main");
      var q = new URLSearchParams(location.search), c = q.get("c"), id = q.get("id");
      var list = c === "lessons" ? Site.flattenLessons() : (S[c] || []);
      var item = Array.isArray(list) ? list.find(function (x) { return x.id === id; }) : null;
      var info = Site.COLLECTIONS[c];

      if (!item || !info) {
        document.title = "Not found · A Little Bit Of…";
        main.innerHTML = '<article class="article"><h1>This page wandered off</h1><p class="lead">The link may be old, or the entry was renamed. Try the search, or go back to the <a href="index.html">home page</a>.</p></article>';
        return;
      }

      var sec = Site.sectionOf(c);
      var backHref = sec.key + ".html" + (info.tab ? "#" + info.tab : "");
      var backLabel = c === "lessons" ? item.courseTitle : (info.tab === "tutorials" ? "Tutorials" : sec.label);
      document.title = (item.title || item.doi) + " · A Little Bit Of…";

      var meta = [];
      if (item.date) meta.push('<time datetime="' + esc(item.date) + '">' + Site.fmtDate(item.date) + '</time>');
      if (item.author || item.director || item.creator) meta.push(esc(item.author || item.director || item.creator) + (item.year ? " (" + esc(item.year) + ")" : ""));
      if (item.place) meta.push(esc(item.place));
      if (item.level) meta.push(esc(item.level));
      if (item.number) meta.push("Episode " + esc(item.number));
      if (item.rating != null) meta.push(Site.stars(item.rating));
      if (item.doi) meta.push('<a href="https://doi.org/' + esc(item.doi) + '">doi:' + esc(item.doi) + '</a>');
      meta.push(Site.exampleTag(item));

      // lesson navigation inside a course
      var lessonNav = "";
      if (c === "lessons") {
        var course = (S.courses || []).find(function (k) { return k.key === item.course; });
        var ready = course.lessons.filter(function (l) { return l.body && !l.soon; });
        var i = ready.findIndex(function (l) { return l.id === item.id; });
        var prev = ready[i - 1], next = ready[i + 1];
        lessonNav = '<nav class="board-head section-gap" aria-label="Lessons">' +
          (prev ? '<a href="' + Site.postUrl("lessons", prev.id) + '">Previous: ' + esc(prev.title) + '</a>' : '<span></span>') +
          (next ? '<a href="' + Site.postUrl("lessons", next.id) + '">Next: ' + esc(next.title) + '</a>' : '<span class="muted">Next lesson coming soon</span>') + '</nav>';
      }

      var embed = item.embed ? '<iframe src="' + esc(item.embed) + '" height="232" loading="lazy" allow="autoplay; clipboard-write; encrypted-media"></iframe>' : "";
      var listen = item.url && c === "podcast" ? '<p><a href="' + esc(item.url) + '">Listen to this episode</a></p>' : "";

      main.innerHTML =
        '<article class="article">' +
          '<a class="back" href="' + backHref + '">Back to ' + esc(backLabel) + '</a>' +
          '<header><h1>' + esc(item.title || "doi:" + item.doi) + '</h1>' +
            '<div class="meta">' + meta.filter(Boolean).join("") + '</div>' + Site.tagList(item.tags) + '</header>' +
          (item.image ? '<img class="hero-img" src="' + esc(item.image) + '" alt="">' : '') +
          '<div class="prose">' + embed + listen + (item.note ? '<p><strong>My take:</strong> ' + esc(item.note) + '</p>' : '') + Site.md(item.body || item.summary || "") + '</div>' +
          lessonNav +
        '</article>';

      Site.highlight(main);

      // a paper page without a title fills it in from the DOI
      if (c === "papers" && !item.title && item.doi) {
        Site.crossref(item.doi).then(function (m) {
          if (!m) return;
          main.querySelector("h1").textContent = m.title;
          document.title = m.title + " · A Little Bit Of…";
          main.querySelector(".meta").insertAdjacentHTML("afterbegin", '<span>' + esc(Site.authorLine(m.authors)) + ' · ' + esc(m.journal) + ' ' + esc(m.year) + '</span>');
        });
      }
    });
  </script>
</body>
</html>
