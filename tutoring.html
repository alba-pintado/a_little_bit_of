<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Alba Pintado Rodrigo">
  <title>Tutoring · A Little Bit Of…</title>
  <meta name="description" content="Private classes in maths, physics, chemistry and biology from 1º ESO to 2º Bachillerato, with downloadable materials.">
  <link rel="icon" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Outfit:wght@400;500;600;700&family=Homemade+Apple&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main id="main" class="wrap"></main>
  <script src="assets/js/site.js"></script>
  <script>
    Site.ready().then(function (S) {
      var esc = Site.esc, T = S.tutoring || { levels: [] }, C = S.config;
      document.getElementById("main").innerHTML = Site.pageHead("tutoring", null, esc(T.intro || "")) +
        (T.note ? '<p class="callout">' + esc(T.note) + (C.email ? ' <a href="mailto:' + esc(C.email) + '">Write to me</a>.' : '') + '</p>' : '') +
        '<div class="levels">' + T.levels.map(function (lv) {
          return '<article class="level"><h3>' + esc(lv.name) + '</h3><ul>' + lv.subjects.map(function (s) {
            var m = s.materials || [];
            return '<li><div>' + esc(s.name) +
              (m.length ? '<ul>' + m.map(function (x) { return '<li><a href="' + esc(x.url) + '">' + esc(x.title) + '</a></li>'; }).join("") + '</ul>' : '') +
              '</div>' + (m.length ? '' : '<span>materials soon</span>') + '</li>';
          }).join("") + '</ul></article>';
        }).join("") + '</div>';
    });
  </script>
</body>
</html>
