<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Alba Pintado Rodrigo">
  <title>Travel · A Little Bit Of…</title>
  <meta name="description" content="Trips, routes and the places worth the detour.">
  <link rel="icon" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Outfit:wght@400;500;600;700&family=Homemade+Apple&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main id="main" class="wrap"></main>
  <script src="assets/js/site.js"></script>
  <script>
    Site.ready().then(function (S) {
      document.getElementById("main").innerHTML = Site.pageHead("travel", null, { en: "Trips, routes and the places worth the detour.", es: "Viajes, rutas y los sitios que merecen el desvío." }) + '<div id="list"></div>';
      var list = (S.travel || []).slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      Site.filterable(document.getElementById("list"), list, Site.R.trips, { id: "travel", placeholder: { en: "Filter trips…", es: "Filtrar viajes…" }, empty: { en: "No trips yet.", es: "Todavía no hay viajes." } });
    });
  </script>
</body>
</html>
