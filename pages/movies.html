<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Alba Pintado Rodrigo">
  <title>Movies, Series &amp; Documentaries · A Little Bit Of…</title>
  <meta name="description" content="Reviews of films, series and documentaries.">
  <link rel="icon" href="../assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Outfit:wght@400;500;600;700&family=Homemade+Apple&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main id="main" class="wrap"></main>
  <script src="../assets/js/site.js"></script>
  <script>
    Site.ready().then(function (S) {
      document.getElementById("main").innerHTML = Site.pageHead("movies", null, { en: "Films, series and documentaries, with a soft spot for anything with a scientist in it.", es: "Películas, series y documentales, con debilidad por cualquier cosa en la que salga una científica." }) + '<div id="list"></div>';
      var list = (S.movies || []).slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      Site.filterable(document.getElementById("list"), list, Site.R.reviews("movies"), { id: "movies", placeholder: { en: "Filter by title, director…", es: "Filtrar por título, director…" }, empty: { en: "No reviews yet.", es: "Todavía no hay reseñas." } });
    });
  </script>
</body>
</html>
