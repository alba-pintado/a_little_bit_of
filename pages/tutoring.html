<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Alba Pintado Rodrigo">
  <title>Tutoring · A Little Bit Of…</title>
  <meta name="description" content="Classes in maths, physics, chemistry and biology from 1º ESO to 2º Bachillerato, with high-level exercises and model exams to download.">
  <link rel="icon" href="../assets/images/logo.svg?v=20261103a" type="image/svg+xml">
  <link rel="icon" href="../assets/images/favicon.png?v=20261103a" type="image/png">
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png?v=20261103a">
  <meta name="theme-color" content="#1c1a47">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Outfit:wght@400;500;600;700&family=Homemade+Apple&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=20261103a">
</head>
<body>
  <main id="main" class="wrap"></main>
  <script src="../assets/js/site.js?v=20261103a"></script>
  <script>
    Site.ready().then(function (S) {
      var esc = Site.esc, tx = Site.tx, f = Site.f, es = Site.lang === "es";
      var T = S.tutoring, C = S.config;
      var BASE = "content/tutoring/materials/";
      var L = es
        ? { all: "Todas", ex: "Ejercicios de alto nivel", exam: "Exámenes modelo", web: "Webs recomendadas", sol: "Soluciones",
            soon: "Próximamente", pdfs: " PDF", write: "Escríbeme", offline: "No se ha podido cargar la lista de PDFs. Vuelve a intentarlo en unos minutos." }
        : { all: "All", ex: "High-level exercises", exam: "Model exams", web: "Recommended websites", sol: "Solutions",
            soon: "Coming soon", pdfs: " PDFs", write: "Write to me", offline: "The list of PDFs couldn't be loaded. Please try again in a few minutes." };

      /* "examen-modelo-1.pdf" → "Examen modelo 1" */
      function niceName(file) {
        var n = decodeURIComponent(file).replace(/\.pdf$/i, "").replace(/[-_]+/g, " ").trim();
        return n.charAt(0).toUpperCase() + n.slice(1);
      }

      /* Every PDF in the repo, read from GitHub (kept for 10 minutes) */
      function loadRepoPdfs() {
        if (!C.repo) return Promise.resolve([]);
        var key = "tree:" + C.repo + ":" + (C.branch || "main"), cached = null;
        try { cached = JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { /* storage blocked */ }
        if (cached && Date.now() - cached.t < 10 * 60 * 1000) return Promise.resolve(cached.paths);
        return fetch("https://api.github.com/repos/" + C.repo + "/git/trees/" + (C.branch || "main") + "?recursive=1")
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(function (j) {
            var paths = (j.tree || []).map(function (x) { return x.path; })
              .filter(function (p) { return p.indexOf(BASE) === 0 && /\.pdf$/i.test(p); });
            try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), paths: paths })); } catch (e) { /* ignore */ }
            return paths;
          })
          .catch(function () { return cached ? cached.paths : null; });
      }

      /* Group PDFs by level / subject / type, and pair each file with its "-soluciones" file */
      function buildIndex(paths) {
        var idx = {}, folderToKey = {};
        Object.keys(T.subjects).forEach(function (k) { folderToKey[T.subjects[k].folder] = k; });
        (paths || []).forEach(function (p) {
          var parts = p.slice(BASE.length).split("/");          // [level, subject, ejercicios|examenes, file]
          if (parts.length !== 4) return;
          var key = folderToKey[parts[1]], type = parts[2] === "examenes" ? "exams" : parts[2] === "ejercicios" ? "exercises" : null;
          if (!key || !type) return;
          var bucket = (((idx[parts[0]] = idx[parts[0]] || {})[key] = idx[parts[0]][key] || {})[type] = idx[parts[0]][key][type] || {});
          var m = parts[3].match(/^(.*?)[-_ ]soluci(?:o|ó)n(?:es)?\.pdf$/i);
          var base = (m ? m[1] : parts[3].replace(/\.pdf$/i, "")).toLowerCase();
          var item = bucket[base] = bucket[base] || { base: m ? m[1] : parts[3].replace(/\.pdf$/i, "") };
          if (m) item.solutions = p; else { item.url = p; item.title = niceName(parts[3]); }
        });
        (T.extra || []).forEach(function (x) {
          var b = (((idx[x.level] = idx[x.level] || {})[x.subject] = idx[x.level][x.subject] || {})[x.type] = idx[x.level][x.subject][x.type] || {});
          b["extra:" + (x.url || x.title)] = x;
        });
        return idx;
      }

      function fileList(bucket) {
        var items = Object.keys(bucket || {}).map(function (k) { return bucket[k]; })
          .map(function (x) { return x.url ? x : { title: niceName(x.base) + (es ? " (soluciones)" : " (solutions)"), url: x.solutions }; })
          .sort(function (a, b) { return String(f(a, "title")).localeCompare(String(f(b, "title")), undefined, { numeric: true }); });
        if (!items.length) return '<p class="none">' + L.soon + '</p>';
        return '<ul>' + items.map(function (x) {
          return '<li><a class="pdf" href="' + esc(Site.url(x.url)) + '" target="_blank" rel="noopener">' + esc(f(x, "title")) + '</a>' +
            (x.solutions && x.url !== x.solutions ? '<a class="sol" href="' + esc(Site.url(x.solutions)) + '" target="_blank" rel="noopener">' + L.sol + '</a>' : '') + '</li>';
        }).join("") + '</ul>';
      }

      function webList(list) {
        if (!list.length) return "";
        return '<h4>' + L.web + '</h4><ul class="webs">' + list.map(function (w) {
          return '<li><a href="' + esc(w.url) + '" target="_blank" rel="noopener">' + esc(w.title) + '</a><span>' + esc(f(w, "note") || "") + '</span></li>';
        }).join("") + '</ul>';
      }

      /* One tab per level; the chosen level is kept in the address (tutoring.html#2bach) */
      var current = location.hash.slice(1).split("/")[0], currentSubject = location.hash.slice(1).split("/")[1];
      if (!T.levels.some(function (lv) { return lv.folder === current; })) current = T.levels[0].folder;


      /* ---- courses without a temario yet: one card per subject ---- */
      function websFor(sub, lv) {
        return (sub.websites || []).concat(T.levelWebsites || []).filter(function (w) { return !w.levels || w.levels.indexOf(lv.folder) >= 0; });
      }
      function legacyCard(lv, k, idx) {
        var sub = T.subjects[k], m = (idx[lv.folder] || {})[k] || {};
        return '<article class="subject-card" data-subject="' + k + '"><h2>' + esc(tx(sub)) + '</h2>' +
          '<div class="group"><h4>' + L.ex + '</h4>' + fileList(m.exercises) +
          '<h4>' + L.exam + '</h4>' + fileList(m.exams) + webList(websFor(sub, lv)) + '</div></article>';
      }
      function legacyView(lv, idx) {
        return '<div class="subject-grid">' + Object.keys(T.subjects).map(function (k) { return legacyCard(lv, k, idx); }).join("") + '</div>';
      }

      /* ---- courses with a temario: subject tabs, then the topics in order ---- */
      var LT = es
        ? { apuntes: "Apuntes", resumen: "Resumen", fc: "Flashcards", fcpdf: "Flashcards PDF", ej: "Ejercicios", sol: "Soluciones",
            tema: "Tema", soon: "En preparación", exam: "Examen modelo", examSol: "Soluciones", cards: " tarjetas", temas: " temas", tema1: " tema" }
        : { apuntes: "Notes", resumen: "One-page summary", fc: "Flashcards", fcpdf: "Flashcards PDF", ej: "Exercises", sol: "Solutions",
            tema: "Topic", soon: "Coming soon", exam: "Model exam", examSol: "Solutions", cards: " cards", temas: " topics", tema1: " topic" };
      function temarioView(lv, TM, idx) {
        var keys = Object.keys(T.subjects);
        var tabs = '<div class="toolbar subject-tabs" role="tablist">' + keys.map(function (k) {
          var n = TM[k] ? TM[k].temas.length : 0;
          return '<button class="chip" type="button" role="tab" data-level="' + lv.folder + '" data-subject="' + k + '" aria-pressed="false">' +
            esc(tx(T.subjects[k])) + (n ? ' <span class="n">' + n + (n === 1 ? LT.tema1 : LT.temas) + '</span>' : '') + '</button>';
        }).join("") + '</div>';
        var panels = keys.map(function (k) {
          var d = TM[k], sub = T.subjects[k];
          if (!d) return '<div class="subject-panel" data-level="' + lv.folder + '" data-subject="' + k + '">' + legacyCard(lv, k, idx) + '</div>';
          var base = "content/tutoring/materials/" + lv.folder + "/" + d.folder + "/";
          var list = '<ol class="temas">' + d.temas.map(function (t) {
            var dir = base + String(t.n).padStart(2, "0") + "-" + t.slug + "/", has = function (f) { return t.files.indexOf(f) >= 0; };
            var btn = function (f, label, cls) {
              return has(f) ? '<a class="mat ' + (cls || "") + '" href="' + esc(Site.url(dir + f + ".pdf")) + '" target="_blank" rel="noopener">' + label + '</a>' : "";
            };
            var mats = t.files.length
              ? btn("apuntes", LT.apuntes, "m-apuntes") + btn("resumen", LT.resumen, "m-resumen") +
                (t.cards ? '<a class="mat m-cards" href="' + esc(Site.url("pages/flashcards.html")) + '?l=' + lv.folder + '&s=' + k + '&t=' + t.n + '">' + LT.fc + ' <span class="n">' + t.cards + '</span></a>' : "") +
                btn("flashcards", LT.fcpdf, "m-cardspdf") + btn("ejercicios", LT.ej, "m-ej") + btn("ejercicios-soluciones", LT.sol, "m-sol")
              : '<span class="soon">' + LT.soon + '</span>';
            return '<li class="tema" id="' + lv.folder + '-' + k + '-' + t.n + '"><span class="tn">' + t.n + '</span><div><h3>' + esc(t.titulo) + '</h3><div class="mats">' + mats + '</div></div></li>';
          }).join("") + '</ol>';
          var exams = (d.examenes || []).map(function (e) {
            return '<li><a class="pdf" href="' + esc(Site.url(base + e.file)) + '" target="_blank" rel="noopener">' + LT.exam + '</a>' +
              (e.solutions ? ' <a class="sol" href="' + esc(Site.url(base + e.solutions)) + '" target="_blank" rel="noopener">' + LT.examSol + '</a>' : '') + '</li>';
          }).join("");
          var webs = websFor(sub, lv);
          return '<div class="subject-panel" data-level="' + lv.folder + '" data-subject="' + k + '">' + list +
            '<div class="temario-extra">' +
              (exams ? '<div class="subject-card" data-subject="' + k + '"><h2>' + LT.exam + '</h2><div class="group"><ul>' + exams + '</ul></div></div>' : '') +
              (webs.length ? '<div class="subject-card" data-subject="' + k + '"><div class="group">' + webList(webs) + '</div></div>' : '') +
            '</div></div>';
        }).join("");
        return tabs + panels;
      }
      function showSubject(level, k) {
        document.querySelectorAll('.subject-panel[data-level="' + level + '"]').forEach(function (p) { p.hidden = p.dataset.subject !== k; });
        document.querySelectorAll('.subject-tabs [data-level="' + level + '"]').forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.subject === k); });
      }

      function render(paths) {
        var idx = buildIndex(paths);
        var note = tx(T.note);
        document.getElementById("main").innerHTML = Site.pageHead("tutoring", null, esc(tx(T.intro))) +
          (note ? '<p class="callout">' + esc(note) + (C.email ? ' <a href="mailto:' + esc(C.email) + '">' + L.write + '</a>.' : '') + '</p>' : '') +
          '<div class="tabs level-tabs" role="tablist">' + T.levels.map(function (lv) {
            var TMl = (S.temario || {})[lv.folder];
            var total = TMl ? Object.keys(TMl).reduce(function (sum, k) { return sum + TMl[k].temas.filter(function (t) { return t.files.length; }).length; }, 0)
              : Object.keys(T.subjects).reduce(function (sum, k) {
              var m = (idx[lv.folder] || {})[k] || {};
              return sum + Object.keys(m.exercises || {}).length + Object.keys(m.exams || {}).length;
            }, 0);
            return '<button role="tab" id="tab-' + lv.folder + '" aria-controls="panel-' + lv.folder + '" data-level="' + lv.folder + '">' + esc(lv.name) +
              (total ? ' <span class="n">' + total + '</span>' : '') + '</button>';
          }).join("") + '</div>' +
          T.levels.map(function (lv) {
            var TM = (S.temario || {})[lv.folder];
            return '<section role="tabpanel" class="level-panel" id="panel-' + lv.folder + '" aria-labelledby="tab-' + lv.folder + '">' +
              (TM ? temarioView(lv, TM, idx) : (paths === null ? '<p class="callout">' + L.offline + '</p>' : '') + legacyView(lv, idx)) + '</section>';
          }).join("");

        function show(level) {
          current = level;
          T.levels.forEach(function (lv) {
            document.getElementById("panel-" + lv.folder).hidden = lv.folder !== level;
            document.getElementById("tab-" + lv.folder).setAttribute("aria-selected", lv.folder === level);
          });
        }
        document.querySelectorAll(".level-tabs [data-level]").forEach(function (b) {
          b.addEventListener("click", function () { history.replaceState(null, "", "#" + b.dataset.level); show(b.dataset.level); });
        });
        document.querySelectorAll(".subject-tabs [data-subject]").forEach(function (b) {
          b.addEventListener("click", function () { history.replaceState(null, "", "#" + b.dataset.level + "/" + b.dataset.subject); showSubject(b.dataset.level, b.dataset.subject); });
        });
        T.levels.forEach(function (lv) {
          var TM = (S.temario || {})[lv.folder]; if (!TM) return;
          var first = Object.keys(T.subjects).filter(function (k) { return TM[k]; })[0] || Object.keys(T.subjects)[0];
          showSubject(lv.folder, lv.folder === current && currentSubject ? currentSubject : first);
        });
        show(current);
      }
      window.addEventListener("hashchange", function () {
        var h = location.hash.slice(1).split("/");
        if (document.getElementById("panel-" + h[0])) document.getElementById("tab-" + h[0]).click();
        if (h[1]) showSubject(h[0], h[1]);
      });

      render([]);                       // draw straight away…
      loadRepoPdfs().then(render);      // …then fill in the PDFs from the repo
    });
  </script>
</body>
</html>
