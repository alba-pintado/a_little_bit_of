<!DOCTYPE html>

  <meta name="author" content="Alba Pintado Rodrigo">
  <title>Page not found · A Little Bit Of…</title>
  <script>
    /* GitHub Pages shows this page for any missing address, at any depth.
       1. Old addresses (…/books.html) jump to their new place (…/pages/books.html).
       2. Every link below is resolved from the site's root folder. */
    (function () {
      var path = location.pathname;
      var old = path.match(/^(.*\/)(science|tutoring|lifestyle|books|movies|travel|music|post)\.html$/);
      if (old && !/\/pages\/$/.test(old[1])) {
        location.replace(old[1] + "pages/" + old[2] + ".html" + location.search + location.hash);
        return;
      }
      var root = /\.github\.io$/.test(location.hostname) ? "/" + (path.split("/")[1] || "") + "/" : "/";
      document.write('<base href="' + root + '">');
    })();
  </script>
